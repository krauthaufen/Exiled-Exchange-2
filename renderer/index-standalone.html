<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Price Check</title>
    <style>
      /* Prevent overscroll bounce revealing parent page */
      html, body { overscroll-behavior: none; background: #1a1a2e; }
      /* Mobile overrides for standalone price check */
      #app {
        overflow-y: auto !important;
        overflow-x: hidden !important;
        height: 1080px !important;
        background: #1a1a2e;
      }
      #app #app { height: auto !important; min-height: 1080px; }
      /* PriceCheckWindow root: position:absolute breaks scroll */
      #price-window { position: relative !important; width: 100% !important; max-width: 100vw !important; }
      .flex.grow.h-full.pointer-events-none { position: relative !important; height: auto !important; min-height: 1080px; width: 100% !important; }
      /* Content panel sizes to content, not viewport */
      #price-window > .grow.layout-column { height: auto !important; }
      #price-window > .grow.layout-column > .layout-column { height: auto !important; }
      /* Force inner content div (28.75rem hardcoded) to fit container */
      #price-window > .grow.layout-column > .layout-column { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
      /* Hide the game overlay pane */
      #price-window ~ div { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main-standalone.ts"></script>
  </body>
</html>
